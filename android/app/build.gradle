plugins { id 'com.android.application' }
android {
    namespace 'com.dashaincards.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.dashaincards.app'
        minSdk 26
        targetSdk 36
        versionCode 35
        versionName '1.7.1'
    }
    signingConfigs {
        if (System.getenv('DASHAIN_UPLOAD_KEYSTORE')) {
            release {
                storeFile file(System.getenv('DASHAIN_UPLOAD_KEYSTORE'))
                storePassword System.getenv('DASHAIN_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('DASHAIN_UPLOAD_KEY_ALIAS') ?: 'dashain-upload'
                keyPassword System.getenv('DASHAIN_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('DASHAIN_UPLOAD_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
}








